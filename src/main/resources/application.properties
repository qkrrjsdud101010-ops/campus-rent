spring.application.name=CampusRent
server.address=127.0.0.1
server.port=8081
spring.config.import=optional:file:./src/main/resources/application-local.properties
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CAMPUSRENT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.log-resolved-exception=false
logging.level.com.zaxxer.hikari=OFF
logging.level.oracle=OFF
logging.level.org.springframework.jdbc=OFF
campus.bootstrap.enabled=false
campus.seed-demo-catalog=false

# Optional external sentence analysis. Rules/manual setup remain available when disabled.
campus.analysis.enabled=${CAMPUS_ANALYSIS_ENABLED:false}
campus.analysis.provider=${CAMPUS_ANALYSIS_PROVIDER:openai}
campus.analysis.openai.api-key=${OPENAI_API_KEY:}
campus.analysis.openai.model=${OPENAI_MODEL:gpt-5.4-mini}
# Gemini is used only when provider=gemini; credentials are never shared between providers.
campus.analysis.api-key=${GEMINI_API_KEY:}
campus.analysis.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
campus.analysis.timeout-ms=8000
campus.analysis.max-calls-per-minute=20
